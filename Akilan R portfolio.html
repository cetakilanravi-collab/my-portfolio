<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akilan R | Full-Stack Web Developer</title>
<meta name="description" content="Portfolio of Akilan R – final-year B.Tech IT student and full-stack web developer (React, Node.js, MySQL).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--tx:#f2efeb;--ac:#e32b3c;--mu:#a09c9a;--ln:rgba(242,239,235,.14);--card:#131313;
--disp:'Anton','Impact',sans-serif;--body:'Manrope',system-ui,sans-serif;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.65 var(--body);overflow-x:hidden}
body.calm *{animation:none!important;transition:none!important}
body.calm .rv{opacity:1;transform:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
section{padding:clamp(64px,10vw,120px) 0;border-top:1px solid var(--ln)}
h1,h2,h3{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:1;margin:0}
h2{font-size:clamp(2rem,5vw,3.6rem);margin-bottom:2rem}
h2::after{content:".";color:var(--ac)}
.eyebrow{color:var(--ac);font-weight:800;letter-spacing:.18em;font-size:.75rem;text-transform:uppercase}
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ac);z-index:60}
header{position:sticky;top:0;z-index:50;background:rgba(9,9,9,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:12px}
.logo{font-family:var(--disp);font-size:1.4rem;letter-spacing:.04em;text-decoration:none}
.logo span{color:var(--ac)}
nav{display:flex;gap:6px;align-items:center}
nav a{padding:10px 12px;text-decoration:none;font-size:.85rem;font-weight:600;color:var(--mu);min-height:44px;display:inline-flex;align-items:center}
nav a:hover,nav a.on{color:var(--tx)}
nav a.on{box-shadow:inset 0 -2px var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border:1px solid var(--tx);background:none;color:var(--tx);font:800 .8rem var(--body);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:.3s}
.btn:hover{background:var(--tx);color:var(--bg)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:#fff;color:var(--ac);border-color:#fff}
#menu{display:none}
.hero{min-height:calc(100vh - 64px);display:flex;align-items:center;border:0;padding:60px 0}
.hero h1{font-size:clamp(3.4rem,11vw,8.5rem);letter-spacing:.01em;margin:.1em 0}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(16px,4vw,48px);align-items:center;position:relative}
.bgw{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-family:var(--disp);font-size:clamp(5rem,22vw,19rem);line-height:.9;color:var(--ac);opacity:.18;text-align:center;pointer-events:none;user-select:none;z-index:0;white-space:nowrap;overflow:hidden}
.hl,.pic{position:relative;z-index:1}
.hello{font-family:'Caveat','Segoe Script',cursive;font-size:clamp(1.8rem,4vw,2.6rem);color:var(--ac);line-height:1;margin-top:.8rem}
.tag{font-family:var(--disp);text-transform:uppercase;font-size:clamp(1.4rem,3.4vw,2.2rem);margin:.6rem 0 1rem;line-height:1.1}
.tag em{font-style:normal;color:var(--ac)}
.pic img{display:block;width:100%;height:auto;max-height:78vh;object-fit:cover;object-position:top;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent),linear-gradient(to right,transparent,#000 20%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 72%,transparent),linear-gradient(to right,transparent,#000 20%);mask-composite:intersect}
.hero p.in{max-width:560px;color:var(--mu);font-size:1.1rem}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:2rem}
.meta{display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--mu);font-size:.85rem;margin-bottom:1rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc84;margin-right:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem;align-items:center}
.chip{min-height:44px;padding:0 16px;background:none;border:1px solid var(--ln);color:var(--mu);font:600 .85rem var(--body);cursor:pointer}
.chip[aria-pressed=true]{color:var(--tx);border-color:var(--ac)}
input,textarea{width:100%;min-height:44px;padding:10px 14px;background:var(--card);border:1px solid var(--ln);color:var(--tx);font:inherit}
#q{max-width:260px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--ln);text-align:left;color:inherit;font:inherit;padding:0;cursor:pointer;transition:transform .4s cubic-bezier(.22,1,.36,1),border-color .3s}
.card:hover{transform:translateY(-6px);border-color:var(--ac)}
.num{position:absolute;top:10px;left:10px;background:var(--ac);color:#fff;font:800 .75rem var(--body);padding:2px 8px;letter-spacing:.08em}
.gal img{display:block;width:100%;height:auto;border:1px solid var(--ln);margin-bottom:10px}
.thumb{position:relative;aspect-ratio:16/10;display:flex;align-items:flex-end;padding:14px;font-family:var(--disp);font-size:2.4rem;color:rgba(255,255,255,.9)}
.cb{padding:18px}
.cb h3{font-size:1.5rem;margin:.3rem 0}
.cb p{margin:0;color:var(--mu);font-size:.92rem}
.empty{color:var(--mu);padding:40px 0}
dialog{max-width:860px;max-height:90vh;width:calc(100% - 32px);background:var(--card);color:var(--tx);border:1px solid var(--ln);padding:0}
dialog::backdrop{background:rgba(0,0,0,.8)}
.dc{padding:28px}
.dc h3{font-size:2.2rem;margin:.4rem 0 1rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:1rem 0}
.tags span{border:1px solid var(--ln);padding:4px 12px;font-size:.8rem;color:var(--mu)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,64px)}
.sk{display:flex;flex-wrap:wrap;gap:10px}
.sk span{border:1px solid var(--ln);padding:8px 16px;font-weight:600;font-size:.9rem}
.tl{list-style:none;margin:0;padding:0}
.tl li{border-top:1px solid var(--ln)}
.tl button{width:100%;display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:64px;background:none;border:0;color:var(--tx);font:700 1.05rem var(--body);text-align:left;cursor:pointer}
.tl button small{color:var(--mu);font-weight:400}
.tl .d{display:none;color:var(--mu);padding:0 0 20px;max-width:640px}
.tl li.open .d{display:block}
form{display:grid;gap:14px;max-width:560px}
label{font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.big{font-family:var(--disp);font-size:clamp(1.6rem,5vw,3rem);text-decoration:none;word-break:break-all}
.big:hover{color:var(--ac)}
footer{border-top:1px solid var(--ln);padding:32px 0;color:var(--mu);font-size:.85rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
#sw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
#swtb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:101;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;max-width:calc(100% - 24px);background:#161616;border:1px solid var(--ln);padding:6px 8px 6px 14px;font-size:.78rem;color:var(--mu)}
#swtb button{min-height:44px;padding:0 14px;background:#242424;color:var(--tx);border:1px solid var(--ln);font:600 .78rem var(--body);cursor:pointer}
#swtb button:hover{border-color:#4da3ff}
@media(max-width:800px){
 .hero-grid{grid-template-columns:1fr}.pic img{max-height:60vh}
 .two{grid-template-columns:1fr}
 #menu{display:inline-flex}
 nav{position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 20px;display:none}
 nav.open{display:flex}
 #q{max-width:none;margin:0;flex:1 1 100%}
}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>

  const size = () => { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  size(); S.rs = size; addEventListener("resize", size);
  S.man = () => { S.manual = performance.now(); };
  ["wheel", "touchmove", "keydown", "pointerdown"].forEach(t => addEventListener(t, S.man, { passive: true }));
  for (let i = 0; i < n; i++) S.agents.push({ x: Math.random() * innerWidth, y: -30 - Math.random() * 120, vx: 0, vy: 0, r: 0, c: cols[i % cols.length], it: null, w: 0, a: Math.random() * 6 });
  pb.onclick = () => { S.paused = !S.paused; pb.textContent = S.paused ? "Resume" : "Pause"; };
  rb.onclick = startSwarm; cb.onclick = stopSwarm;
  $("motion").setAttribute("aria-pressed", "true");
  const reveal = it => {
    const e = it.e, k = it.k;
    const kf = k === "text" ? [{ opacity: 1, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0 0 0)" }]
      : k === "media" ? [{ opacity: 1, clipPath: "inset(100% 0 0 0)", transform: "scale(1.06)", filter: "blur(6px)" }, { opacity: 1, clipPath: "inset(0 0 0 0)", transform: "scale(1)", filter: "blur(0)" }]
      : [{ opacity: 0, transform: "scale(.85)" }, { opacity: 1, transform: "scale(1)" }];
    const an = e.animate(kf, { duration: k === "media" ? 800 : k === "text" ? 650 : 400, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" });
    S.anims.push(an);
    an.onfinish = () => { e.style.opacity = "1"; an.cancel(); };
  };
  const steer = (a, tx, ty, dt, fast) => {
    const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(fast || 700, d * 4 + 120), k = Math.min(1, dt * 5);
    a.vx += (dx / d * sp - a.vx) * k; a.vy += (dy / d * sp - a.vy) * k; a.x += a.vx * dt; a.y += a.vy * dt; return d;
  };
  const update = dt => {
    const W = innerWidth, H = innerHeight;
    if (S.phase === "build") {
      const inView = it => { const r = it.e.getBoundingClientRect(); return r.top < H - 40 && r.bottom > 0; };
      const pend = S.items.filter(i => !i.taken);
      S.gap -= dt; S.ts = null;
      const front = S.items[S.next];
      if (front && performance.now() - S.manual > 1500) { const r = front.e.getBoundingClientRect(); if (r.top > H * .5 || r.bottom < 0) S.ts = Math.max(0, Math.min(document.documentElement.scrollHeight - H, r.top + scrollY - H * .3)); }
      if (S.ts != null) { const d = S.ts - scrollY; if (Math.abs(d) > 2) scrollTo({ top: scrollY + d * Math.min(1, dt * 4), behavior: "instant" }); }
      S.agents.forEach(a => {
        if (a.it && a.w > 0) { a.w -= dt; a.vx *= .8; a.vy *= .8; if (a.w <= 0) { a.it.e.style.opacity = "1"; a.it = null; } return; }
        if (!a.it) {
          const h = pend.find(i => !i.taken);
          if (h) { h.taken = true; a.it = h; S.qi++; }
          else { a.a += dt; a.vx += (Math.cos(a.a * 1.7) * 90 + (W / 2 - a.x) * .3) * dt; a.vy += (Math.sin(a.a * 1.3) * 90 + (H / 2 - a.y) * .3) * dt; a.x += a.vx * dt; a.y += a.vy * dt; return; }
        }
        const r = a.it.e.getBoundingClientRect(), ty = Math.max(24, Math.min(H - 24, r.top + r.height / 2));
        if (steer(a, r.left + r.width / 2, ty, dt) < 16 && a.it.idx === S.next && S.gap <= 0 && inView(a.it)) { a.w = .3 + Math.random() * .3; S.next++; S.gap = .1; S.boxes.push({ e: a.it.e, life: 1.1, t: 0, k: a.it.k }); reveal(a.it); }
      });
      if (!pend.length && S.agents.every(a => !a.it)) { S.phase = "ring"; S.pt = 0; }
    } else {
      S.pt += dt;
      S.agents.forEach((a, i) => {
        if (S.phase === "ring") { const ang = i / n * 6.283 + S.pt * 1.4, R = Math.min(W, H) * .22; steer(a, W / 2 + Math.cos(ang) * R, H / 2 + Math.sin(ang) * R, dt, 900); }
        else steer(a, a.x, -200, dt, 900);
      });
      if (S.phase === "ring" && S.pt > 2.6) { S.phase = "out"; S.pt = 0; }
      if (S.phase === "out" && S.pt > 1) { stopSwarm(); scrollTo({ top: 0, behavior: "smooth" }); return; }
    }
    S.boxes.forEach(b => { b.life -= dt; b.t += dt; }); S.boxes = S.boxes.filter(b => b.life > 0);
  };
  const draw = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight); ctx.lineWidth = 1.5; ctx.strokeStyle = "#4da3ff"; ctx.fillStyle = "#fff";
    S.boxes.forEach(b => {
      const r = b.e.getBoundingClientRect(); ctx.globalAlpha = Math.min(1, b.life * 2);
      const p = Math.min(1, b.t / (b.k === "media" ? .8 : .65));
      if (b.k === "text") { ctx.globalAlpha *= .3 * (1 - p * .6); ctx.fillStyle = "#4da3ff"; ctx.fillRect(r.left, r.top, r.width * p, r.height); ctx.fillStyle = "#fff"; ctx.globalAlpha = Math.min(1, b.life * 2); }
      else if (b.k === "media") { ctx.globalAlpha *= .9; ctx.fillStyle = "#4da3ff"; ctx.fillRect(r.left, r.bottom - r.height * p - 1, r.width, 2); ctx.fillStyle = "#fff"; ctx.globalAlpha = Math.min(1, b.life * 2); }
      ctx.strokeRect(r.left - 3, r.top - 3, r.width + 6, r.height + 6);
      [[r.left - 3, r.top - 3], [r.right + 3, r.top - 3], [r.left - 3, r.bottom + 3], [r.right + 3, r.bottom + 3]].forEach(([x, y]) => { ctx.fillRect(x - 3, y - 3, 6, 6); ctx.strokeRect(x - 3, y - 3, 6, 6); });
    });
    ctx.globalAlpha = S.phase === "out" ? Math.max(0, 1 - S.pt) : 1;
    S.agents.forEach(a => {
      if (Math.hypot(a.vx, a.vy) > 8) a.r = Math.atan2(a.vy, a.vx);
      ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.r); ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(-7, 6); ctx.lineTo(-3, 0); ctx.lineTo(-7, -6); ctx.closePath(); ctx.fill(); ctx.restore();
    });
    ctx.globalAlpha = 1;
    st.textContent = "● " + n + " agents · " + Math.max(0, S.qi - S.agents.filter(a => a.it).length) + "/" + S.items.length + " tasks · " + (S.phase === "build" ? "Building" : "Done");
  };
  const tick = now => {
    if (SW !== S) return;
    const dt = Math.min((now - S.last) / 1000, .05); S.last = now;
    if (!S.paused) update(dt);
    if (SW !== S) return;
    draw(); S.raf = requestAnimationFrame(tick);
  };
  S.raf = requestAnimationFrame(tick);
}
$("motion").onclick = () => SW ? stopSwarm() : startSwarm();
// Auto-play once on every page open (Motion button replays it)
if (document.readyState === "complete") setTimeout(startSwarm, 300);
else addEventListener("load", () => setTimeout(startSwarm, 300));
document.querySelectorAll("section").forEach(s => s.classList.add("rv"));
const io = new IntersectionObserver(es => es.forEach(en => en.isIntersecting && en.target.classList.add("in")), { threshold: .08 });
document.querySelectorAll(".rv").forEach(n => io.observe(n));
const links = [...$("nav").querySelectorAll("a")];
addEventListener("scroll", () => {
  const h = document.documentElement; $("pg").style.width = (scrollY / (h.scrollHeight - innerHeight) * 100) + "%";
  let cur = ""; sections.forEach(([id]) => { const n = $(id); if (n && n.getBoundingClientRect().top < innerHeight * .4) cur = id; });
  links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur));
}, { passive: true });
addEventListener("keydown", e => { if (e.key === "Escape") { $("nav").classList.remove("open"); stopSwarm(); } });
</script>
</body>
